AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: subsc-analyzer

Globals:
  Function:
    Timeout: 3
  Api:
    Cors:
      AllowMethods: "'POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello-world/
      Handler: app.lambdaHandler
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      # ↓ここから Properties の「中」に入れます
      Events:
        AnalyzeAPI:
          Type: Api
          Properties:
            Path: /analyze
            Method: any
      Policies: # ← 正しい位置（一段下げた）
        - DynamoDBCrudPolicy:
            TableName: !Ref CacheTable
      Environment: # ← 正しい位置（一段下げた）
        Variables:
          CACHE_TABLE_NAME: !Ref CacheTable

  CacheTable:
    Type: AWS::Serverless::SimpleTable
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete # 前回の警告対策も追加
    Properties:
      PrimaryKey:
        Name: url
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

Outputs:
  HelloWorldApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/analyze/"